<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FINLY - Finanz-Buddy</title>
    <link rel="stylesheet" href="../static/css/style.css" />
    <!-- Markdown-Parser für formatierte Bot-Antworten -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>

  <body>
    <div class="container">
      <!-- ============ SIDEBAR (identisch zu anderen Seiten) ============ -->
      <aside class="sidebar">
        <div class="logo">
          <span>📊</span>
          <span>FINLY</span>
        </div>

        <ul class="nav-items">
          <li class="nav-item">
            <button
              class="nav-link"
              onclick="window.location.href='index.html'"
            >
              <span class="nav-icon">📈</span>
              <span>Übersicht</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              onclick="window.location.href='transactions.html'"
            >
              <span class="nav-icon">💳</span>
              <span>Transaktionen</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              onclick="window.location.href='kategorien.html'"
            >
              <span class="nav-icon">🏷️</span>
              <span>Kategorien</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              onclick="window.location.href='konten.html'"
            >
              <span class="nav-icon">🏦</span>
              <span>Konten</span>
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="nav-forecast" onclick="window.location.href='/templates/zinsrechner.html'">
              <span class="nav-icon">📉</span>
              <span>Zinsprognose</span>
            </button>
          </li>
          <li class="nav-item">
            <!-- AKTIV: Wir sind auf der Finanz-Buddy-Seite -->
            <button class="nav-link active" id="nav-chatbot">
              <span class="nav-icon">💬</span>
              <span>Finanz-Buddy</span>
            </button>
          </li>
        </ul>
      </aside>

      <!-- ============ HAUPTBEREICH ============ -->
      <div class="main">
        <!-- ============ HEADER ============ -->
        <header class="header">
          <div class="header-right">
            <button class="icon-btn">⚙️</button>
          </div>
        </header>

        <!-- ============ CONTENT ============ -->
        <div class="content">
          <div class="page-header">
            <h1>Finanz-Buddy</h1>
            <p>Dein persönlicher KI-Finanzassistent: Frage mich alles über deine Finanzen!</p>
          </div>

          <!-- Reset Button -->
          <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <button id="resetChatBtn" style="padding: 10px 20px; background: #ff6b6b; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.2s;">
              🗑️ Reset Chat
            </button>
          </div>

          <!-- Chat-Container -->
          <div class="chat-container">
            <!-- Chat-Nachrichten -->
            <div class="chat-messages" id="chatMessages">
              <!-- Nachrichten werden hier dynamisch hinzugefügt -->
            </div>

            <!-- Eingabebereich -->
            <div class="chat-input-container">
              <textarea
                id="chatInput"
                class="chat-input"
                placeholder="Stelle eine Frage..."
                rows="1"
              ></textarea>
              <button id="sendButton" class="chat-send-btn">
                <span>↑</span>
              </button>
            </div>

            <!-- Lade-Indikator (versteckt standardmäßig) -->
            <div class="chat-loading" id="chatLoading" style="display: none">
              <span>🤔 Denke nach...</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="/static/js/chatbot.js"></script>
  </body>
</html>
