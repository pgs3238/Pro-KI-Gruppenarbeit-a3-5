<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsives Design für Laptop/Handy -->
    <title>FINLY - Finanzübersicht</title>
    <!-- Browser Tab Titel -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bibliothek laden um Diagramme anzuzeigen -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Plotly.js für Sankey -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- Laden des CSS Stylings -->
  </head>

  <body>
    <div class="container">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar">
        <div class="logo">
          <span>📊</span>
          <span>FINLY</span>
        </div>

        <ul class="nav-items">
          <li class="nav-item">
            <button class="nav-link active" id="nav-overview">
              <span class="nav-icon">📈</span>
              <span>Übersicht</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              id="nav-transaction"
              onclick="window.location.href='transactions.html'"
            >
              <span class="nav-icon">💳</span>
              <span>Transaktionen</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              id="nav-categories"
              onclick="window.location.href='kategorien.html'"
            >
              <span class="nav-icon">🏷️</span>
              <span>Kategorien</span>
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              id="nav-accounts"
              onclick="window.location.href='konten.html'"
            >
              <span class="nav-icon">🏦</span>
              <span>Konten</span>
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Zinsprognose -->
            <button class="nav-link" id="nav-forecast" onclick="window.location.href='zinsrechner.html'">
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">📉</span>
              <!-- Zinsprognose Icon -->
              <span>Zinsprognose</span>
              <!-- Name des Menupunktes "Zinsprognose" -->
            </button>
          </li>
          <li class="nav-item">
            <button
              class="nav-link"
              id="nav-chatbot"
              onclick="window.location.href='chatbot.html'"
            >
              <span class="nav-icon">💬</span>
              <span>Finanz-Buddy</span>
            </button>
          </li>
        </ul>
      </aside>

      <!-- ============ HAUPTBEREICH ============ -->
      <div class="main">
        <!-- ============ HEADER ============ -->
        <header class="header">
          <div class="header-right">
            <div class="search-wrapper">
              <!-- Container für Suchfunktion -->
              <span class="search-icon">🔍</span>
              <!-- Such Icon -->
              <input
                type="text"
                class="search-box"
                id="searchBox"
                placeholder="Suche"
              />
            </div>
            <button class="icon-btn">⚙️</button>
            <!-- Einstellungen Icon -->
          </div>
        </header>

        <!-- ============ CONTENT ============ -->
        <div class="content">
          <div class="page-header">
            <h1>Dashboard</h1>
            <p>Ihr Finanzüberblick auf einen Blick</p>
          </div>

          <!-- KPI Cards -->
          <div class="dashboard-kpis">
            <div class="kpi-card">
              <div class="kpi-icon">📊</div>
              <div class="kpi-content">
                <div class="kpi-label">Einnahmen (Monat)</div>
                <div class="kpi-value" id="monthlyIncome">0,00 €</div>
                <div class="kpi-change" id="incomeChange">--</div>
              </div>
            </div>

            <div class="kpi-card">
              <div class="kpi-icon">💸</div>
              <div class="kpi-content">
                <div class="kpi-label">Ausgaben (Monat)</div>
                <div class="kpi-value" id="monthlyExpenses">0,00 €</div>
                <div class="kpi-change" id="expensesChange">--</div>
              </div>
            </div>

            <div class="kpi-card">
              <div class="kpi-icon">📈</div>
              <div class="kpi-content">
                <div class="kpi-label">Bilanz (Monat)</div>
                <div class="kpi-value" id="monthlyBalance">0,00 €</div>
                <div class="kpi-change" id="balanceChangePercent">--</div>
              </div>
            </div>
          </div>

          <!-- Main Dashboard Grid -->
          <div class="dashboard-grid">
            <!-- Konten Übersicht -->
            <div class="dashboard-card">
              <div class="dashboard-card-header">
                <h2>🏦 Meine Konten</h2>
                <button class="card-link-btn" onclick="window.location.href='konten.html'">
                  Mehr →
                </button>
              </div>
              <div class="accounts-preview" id="accountsPreview">
                <!-- Wird mit JavaScript gefüllt -->
              </div>
            </div>

            <!-- Letzte Transaktionen -->
            <div class="dashboard-card">
              <div class="dashboard-card-header">
                <h2>💳 Letzten Transaktionen</h2>
                <button class="card-link-btn" onclick="window.location.href='transactions.html'">
                  Mehr →
                </button>
              </div>
              <div class="transactions-preview" id="transactionsPreview">
                <!-- Wird mit JavaScript gefüllt -->
              </div>
            </div>

            <!-- Top Kategorien -->
            <div class="dashboard-card">
              <div class="dashboard-card-header">
                <h2>🏷️ Top Ausgaben-Kategorien</h2>
                <button class="card-link-btn" onclick="window.location.href='kategorien.html'">
                  Mehr →
                </button>
              </div>
              <div class="categories-preview" id="categoriesPreview">
                <!-- Wird mit JavaScript gefüllt -->
              </div>
            </div>

            <!-- Ausgaben Trend -->
            <div class="dashboard-card">
              <div class="dashboard-card-header">
                <h2>📉 Ausgaben-Trend</h2>
              </div>
              <div class="chart-container-small">
                <canvas id="expensesTrendChart"></canvas>
              </div>
            </div>
          </div>

          <!-- Sankey Diagramm -->
          <div class="card" style="margin-top: 20px;">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
              <h2 style="margin: 0;">🔀 Geldfluss nach Kategorien</h2>
              <div style="display: flex; align-items: center; gap: 15px;">
                <button id="sankeyPrevMonth" style="background: #333; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px 12px; border-radius: 5px;" title="Vorheriger Monat">◀</button>
                <span id="sankeyMonthLabel" style="font-size: 16px; font-weight: 500; min-width: 140px; text-align: center;">Januar 2026</span>
                <button id="sankeyNextMonth" style="background: #333; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 5px 12px; border-radius: 5px;" title="Nächster Monat">▶</button>
              </div>
            </div>
            <div id="sankeyChart" style="width: 100%; height: 500px;"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
