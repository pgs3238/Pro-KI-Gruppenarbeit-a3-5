<!DOCTYPE html>
<!-- Sagt dem Browser das diese Datei eine HTML Datei ist (muss immer ganz oben stehen) -->
<html lang="de">
  <!-- Öffnet das HTML Dokument und sagt dass es Deutsch ist -->

  <head>
    <!-- Kopf der Seite (unsichtbar); Quasi Anleitung für den User-->
    <meta charset="UTF-8" />
    <!-- Anzeigen von Umlauten -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Responsives Design für Laptop/Handy -->
    <title>FINLY - Finanzübersicht</title>
    <!-- Browser Tab Titel -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bibliothek laden um Diagramme anzuzeigen -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Plotly.js für Sankey -->
    <link rel="stylesheet" href="/static/css/style.css" />
    <!-- Laden des CSS Stylings -->
  </head>

  <body>
    <!-- Körper der Seite (Alles was der Nutzer sieht steht hier-->
    <div class="container">
      <!-- Haupt Klasse container, die alles beinhaltet. Eigentlich nicht notwendig hier eine Klasse zu machen, ist aber Standard in der Web-Entwicklung -->
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar">
        <div class="logo">
          <!-- Logo der App -->
          <span>📊</span>
          <!-- Icon der App -->
          <span>FINLY</span>
          <!-- Name der APP: FINLY als Text -->
        </div>

        <ul class="nav-items">
          <!-- Navigations Liste -->
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Übersicht -->
            <button class="nav-link active" id="nav-overview">
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">📈</span>
              <!-- Übersichts Icon -->
              <span>Übersicht</span>
              <!-- Name des Menupunktes "Übersicht" -->
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Transaktion -->
            <button
              class="nav-link"
              id="nav-transaction"
              onclick="window.location.href='/templates/transactions.html'"
            >
              <span class="nav-icon">💳</span>
              <span>Transaktionen</span>
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Kategorien -->
            <button
              class="nav-link"
              id="nav-categories"
              onclick="window.location.href='/templates/kategorien.html'"
            >
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">🏷️</span>
              <!-- Kategorien Icon -->
              <span>Kategorien</span>
              <!-- Name des Menupunktes "Kategorien" -->
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Konten -->
            <button
              class="nav-link"
              id="nav-accounts"
              onclick="window.location.href='/templates/konten.html'"
            >
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">🏦</span>
              <!-- Konten Icon -->
              <span>Konten</span>
              <!-- Name des Menupunktes "Konten" -->
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Zinsprognose -->
            <button class="nav-link" id="nav-forecast" onclick="window.location.href='/templates/zinsrechner.html'">
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">📉</span>
              <!-- Zinsprognose Icon -->
              <span>Zinsprognose</span>
              <!-- Name des Menupunktes "Zinsprognose" -->
            </button>
          </li>
          <li class="nav-item">
            <!-- Listenelement für Navigations Item Chatbot -->
            <button
              class="nav-link"
              id="nav-chatbot"
              onclick="window.location.href='/templates/chatbot.html'"
            >
              <!-- Interaktiven Button mit eindeutiger ID -->
              <span class="nav-icon">🤖</span>
              <!-- Chatbot Icon -->
              <span>Chatbot</span>
              <!-- Name des Menupunktes "Chatbot" -->
            </button>
          </li>
        </ul>
      </aside>

      <!-- ============ HAUPTBEREICH ============ -->
      <div class="main">
        <!-- ============ HEADER ============ -->
        <header class="header">
          <div class="header-right">
            <div class="search-wrapper">
              <!-- Container für Suchfunktion -->
              <span class="search-icon">🔍</span>
              <!-- Such Icon -->
              <input
                type="text"
                class="search-box"
                id="searchBox"
                placeholder="Suche"
              />
            </div>
            <button class="icon-btn">⚙️</button>
            <!-- Einstellungen Icon -->
          </div>
        </header>

        <!-- ============ CONTENT ============ -->
        <div class="content">
          <div class="page-header">
            <h1>Finanzübersicht</h1>
            <!-- Seitentitel -->
            <p>Anzeigen und Verwalten Sie Ihre Finanzen hier</p>
            <!-- Beschreibung -->
          </div>
          <div class="cards-grid">
            <!-- ============ MEINE KONTEN ============ -->
            <div class="card konten-card">
              <div class="card-title">Meine Konten</div>
              <!-- Überschrift der Karte "Meine Konten" -->
              <div class="balance-container">
                <div class="total-balance" id="totalBalance">0,00€</div>
                <!-- Gesamtbetrag mit Anfangswert 0-->
                <div class="balance-trend" id="balanceTrend">+0,0%</div>
                <!-- Tendenz der Entwicklung -->
              </div>
              <div class="balance-label">Gesamtbetrag</div>
              <!-- Beschriftung des Gesamtbetrags -->
              <div class="konten-list" id="kontenList">
                <!-- Liste der Konten -->
                <!-- Wird mit JavaScript gefüllt -->
              </div>
            </div>

            <!-- ============ BALANCE DIAGRAMM ============ -->
            <div class="card">
              <div class="card-title">Meine Bilanz</div>
              <!-- Überschrift der Karte "Bilanz" -->
              <div class="chart-container">
                <!-- Container für das Diagramm -->
                <canvas id="balanceChart"></canvas>
                <!-- Darstellung des Diagramms -->
              </div>
            </div>

            <!-- ============ SANKEY DIAGRAMM ============ -->
            <div class="card sankey-card" style="grid-column: 1 / -1">
              <div class="card-title">Geldfluss nach Kategorien</div>
              <!-- Überschrift der Karte "Sankey" -->
              <div class="chart-container">
                <!-- Container für das Sankey-Diagramm -->
                <div id="sankeyChart"></div>
                <!-- Darstellung des Sankey-Diagramms -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== SCRIPTS ==================== -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/js/app.js"></script>
  </body>
</html>
